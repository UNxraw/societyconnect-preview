 const start=new Date((n.startDate||'2026-07-01')+'T00:00:00');

}
function nurkMonthLabel(n, month){

 return d.toLocaleDateString('en-IN',{month:'long',year:'numeric'})+' · '+due+'th';
}
function nurkAvailableMonths(n){
 const start=new Date((n.startDate||'2026-07-01')+'T00:00:00');
 const now=new Date();
 const due=Number(n.dueDay||String(n.startDate||'2026-07-01').slice(8,10))||1;
 const diff=(now.getFullYear()-start.getFullYear())*12+(now.getMonth()-start.getMonth());
 let elapsed=diff;
 /* A new NURK month becomes current only after its collection due day.
    Example: due day 10 -> Nov 7 is still October; Nov 10 becomes November. */
 if(now.getDate()<due) elapsed-=1;
 elapsed=Math.max(0,Math.min(Number(n.months||NM)-1,elapsed));
 return now < start ? [] : Array.from({length:elapsed+1},(_,i)=>i+1);
}
function nurkCycleNumber(n,x){
 if(x.nurkMonth) return Number(x.nurkMonth);
 const base=n.startDate||'2026-07-01';
 const dt=new Date((x.d||base)+'T00:00:00'), st=new Date(base+'T00:00:00');
 return (dt.getFullYear()-st.getFullYear())*12+(dt.getMonth()-st.getMonth())+1;
}
function nurkOverall(n){
 const r=rows(n.e).filter(x=>x.ref===n.id), members=n.mem||[], months=Number(n.months||NM);
 const expected=n.amt*members.length*months;
 const legacyCollected=sum(r.filter(x=>x.pu==='nurk_in').map(x=>x.a));
 const receipts=NURK_RECEIPTS.filter(x=>x.nurkId===n.id);
 const collected=receipts.length?sum(receipts.map(x=>Number(x.amount||0))):legacyCollected;
 const payouts=-sum(r.filter(x=>x.pu==='nurk_out').map(x=>x.a));
 const transferred=-sum(r.filter(x=>x.pu==='nurk_transfer').map(x=>x.a));
 const advance=receipts.reduce((s,x)=>s+Math.max(0,Number(x.amount||0)-Number(x.allocated||0)),0);
 return {expected,collected,pending:Math.max(0,expected-collected),payouts,transferred,remaining:collected-payouts-transferred,advance};
}

 const cycleExpected=n.amt*members.length*totalMonths;
 const r=rows(n.e).filter(x=>x.ref===n.id);
 const today=new Date(); today.setHours(23,59,59,999);
 const receipts=NURK_RECEIPTS.filter(x=>x.nurkId===n.id && new Date((x.date||'9999-12-31')+'T23:59:59')<=today);

 let dueAsOf=0, coveredAsOf=0;
 for(let m=1;m<=currentMonth;m++){
   dueAsOf+=n.amt*members.length;

     const paid=sum(r.filter(x=>x.pu==='nurk_in'&&x.p===pid&&nurkCycleNumber(n,x)===m).map(x=>x.a));

function nurkPeriodData(n,month){
 const r=rows(n.e).filter(x=>x.ref===n.id), members=n.mem||[], expected=n.amt*members.length;
 const monthStart=nurkMonthStart(n,month);
 const nextStart=nurkMonthStart(n,month+1);
 const receipts=NURK_RECEIPTS.filter(x=>{
   if(x.nurkId!==n.id)return false;
   const d=new Date((x.date||'')+'T00:00:00');
   return d>=monthStart && d<nextStart;
 });
 /* Actual cash is counted only in the month it was received. */
 const collected=receipts.length?sum(receipts.map(x=>Number(x.amount||0))):sum(
   r.filter(x=>x.pu==='nurk_in'&&!x.voided&&!x.isAllocationOnly&&nurkCycleNumber(n,x)===month).map(x=>x.a)
 );
 const contrib=r.filter(x=>x.pu==='nurk_in'&&nurkCycleNumber(n,x)===month);
 const payouts=r.filter(x=>x.pu==='nurk_out'&&nurkCycleNumber(n,x)===month);
 const given=-sum(payouts.map(x=>x.a));
 /* Pending is based on month coverage, not cash duplication. */
 let covered=0;
 members.forEach(pid=>{
   const paidForMonth=sum(r.filter(x=>x.pu==='nurk_in'&&!x.voided&&x.p===pid&&nurkCycleNumber(n,x)===month).map(x=>x.a));
   if(paidForMonth>=n.amt)covered+=n.amt;
 });
 const pending=Math.max(0,expected-covered);
 return {r,members,expected,contrib,payouts,collected,given,pending,balance:collected-given};
}

   });
 }
 return out;
}

function parseCsvText(text){
 const lines=text.split(/\r?\n/).filter(x=>x.trim()); if(!lines.length)return [];
 const parseLine=line=>{const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++;}else q=!q;}else if(c===','&&!q){out.push(cur.trim());cur='';}else cur+=c;}out.push(cur.trim());return out;};
 const heads=parseLine(lines[0]).map(x=>x.toLowerCase().replace(/[^a-z0-9]+/g,'_'));
 return lines.slice(1).map(line=>{const a=parseLine(line),o={};heads.forEach((h,i)=>o[h]=a[i]||'');return o;});
}
async function parseNurkBulkFile(n,month,file){
 const text=await file.text(); let data=[];
 if(/\.csv$/i.test(file.name)) data=parseCsvText(text);
 else {
   if(!window.XLSX){
     await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';sc.onload=resolve;sc.onerror=reject;document.head.appendChild(sc)}).catch(()=>{});
   }
   if(window.XLSX){const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];data=XLSX.utils.sheet_to_json(ws,{defval:''});}
   else throw new Error('Excel reader could not load. Save the sheet as CSV and try again.');
 }
 if(!data.length)throw new Error('No rows found in the file.');
 const result=[];
 data.forEach((row,idx)=>{
   const rawId=String(row.member_id??row.memberid??row.id??'').trim();
   const pid=findNurkMember(n.e,rawId);
   const amount=Number(String(row.amount_paid??row.amount??'').replace(/,/g,''));
   const rowMonth=String(row.month??row.period??'').trim();
   const date=String(row.date??row.payment_date??'').trim()||new Date().toISOString().slice(0,10);
   const remarks=String(row.remarks??row.note??'').trim();
   let status='ok',message='Ready to upload',selected=true;
   if(!pid){status='bad';message=`Member ID ${rawId||'(blank)'} not found`;selected=false;}
   else if(!(amount>0)){status='bad';message='Invalid amount';selected=false;}
   else if(rowMonth && rowMonth!==String(month) && rowMonth.toLowerCase()!==nurkMonthLabel(n,month).toLowerCase()){status='bad';message='Month does not match selected month';selected=false;}
   else if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){status='bad';message='Invalid payment date';selected=false;}
   else {
     const existing=rows(n.e).filter(x=>x.ref===n.id&&x.p===pid&&x.pu==='nurk_in'&&nurkCycleNumber(n,x)===month);
     if(existing.length){status='warn';message='Existing payment already recorded for this month';selected=false;}
   }
   result.push({rowNo:idx+2,pid,rawId,amount,date,remarks,status,message,selected,name:pid?(P[pid]?.name||''):''});
 });
 return result;
}

function nurkMemberLedgerData(n,p){
 const r=rows(n.e).filter(x=>x.ref===n.id), months=nurkAvailableMonths(n);
 const monthRows=months.map(m=>{const entries=r.filter(x=>x.pu==='nurk_in'&&x.p===p&&nurkCycleNumber(n,x)===m);const paidAmt=sum(entries.map(x=>x.a));const dates=entries.map(x=>x.d).filter(Boolean).join(', ');return {m,paid:paidAmt,dates,pending:Math.max(0,n.amt-paidAmt)};});
 const payouts=r.filter(x=>x.pu==='nurk_out'&&x.p===p).map(x=>({date:x.d,amount:-x.a,month:x.nurkMonth?nurkMonthLabel(n,x.nurkMonth):'—',note:x.note||''}));
 const totalPaid=sum(monthRows.map(x=>x.paid)), pendingMonths=monthRows.filter(x=>x.pending>0).length, totalPending=sum(monthRows.map(x=>x.pending)), totalPayout=sum(payouts.map(x=>x.amount));
 const receipts=NURK_RECEIPTS.filter(x=>x.nurkId===n.id&&x.pid===p), advance=sum(receipts.map(x=>x.advance||0));
 return {r,months,monthRows,payouts,totalPaid,pendingMonths,totalPending,totalPayout,advance,receipts};
}

function monthlyPeriodsForDef(d){
 const out=[]; if(!d||!['Active','Paused','Stopped','Ended','Completed'].includes(d.status))return out;
 const start=new Date((d.start||new Date().toISOString().slice(0,10))+'T00:00:00');
 const now=new Date(); const dueDay=Math.min(28,Math.max(1,Number(d.dueDay||5)));
 let y=start.getFullYear(),m=start.getMonth(); let guard=0;
 while(guard++<120){
   const due=new Date(y,m,dueDay,23,59,59,999);
   if(d.end && due>new Date(d.end+'T23:59:59'))break;
   if(due>now)break;
   out.push(`${y}-${String(m+1).padStart(2,'0')}`);
   m++; if(m===12){m=0;y++;}
 }
 return out;
}
function monthlyPaidForPeriod(d,pid,period){return rows(cur).filter(x=>!x.voided&&x.p===pid&&x.pu==='monthly'&&x.contribId===d.id&&String(x.period||'')===period).reduce((n,x)=>n+Number(x.a||0),0)}
function monthlyPendingRows(pid){
 const out=[]; CONTRIBS.filter(d=>d.e===cur&&d.type==='monthly'&&['Active','Paused','Stopped','Ended','Completed'].includes(d.status)).forEach(d=>monthlyPeriodsForDef(d).forEach(period=>{const due=Number(d.amt||0),paid=monthlyPaidForPeriod(d,pid,period),balance=Math.max(0,due-paid);if(balance>0)out.push({def:d,period,due,paid,balance});})); return out;
}

 </div>`;

function memberLedgerHtml(pid){
 const entries=rows(cur).filter(x=>!x.voided&&String(x.p)===String(pid)&&(x.pu==='monthly'||x.pu==='special')).slice().sort((a,b)=>{
   const d=String(b.d||'').localeCompare(String(a.d||''));
   return d || Number(b.id||0)-Number(a.id||0);
 });
 const monthly=entries.filter(x=>x.pu==='monthly').reduce((n,x)=>n+Number(x.a||0),0);
 const special=entries.filter(x=>x.pu==='special').reduce((n,x)=>n+Number(x.a||0),0);
 const pendingMonthly=monthlyPendingRows(pid).reduce((n,x)=>n+x.balance,0);
 const pendingSpecial=CONTRIBS.filter(d=>d.e===cur&&d.type==='special'&&d.status==='Active').reduce((n,d)=>n+Math.max(0,Number(d.amt||0)-contributionPaidByMember(d,pid)),0);
 return `<div class="erp-monthly-book nurk-month-panel" style="margin:0">

   <div class="erp-actionbar"><div class="erp-action-primary"><button class="btn p" id="ledgerReceivePayment">+ Receive Payment</button></div><div class="erp-action-secondary"><button class="btn" id="ledgerPrintStatement">Print Statement</button><button class="btn" id="ledgerClose">Close Ledger</button></div></div>

   <div class="erp-register-card"><div class="erp-register-head"><div><b>Current Outstanding</b><span>Only currently payable items are shown</span></div></div><div class="erp-table-wrap"><table class="erp-register-table"><thead><tr><th>Type</th><th>Payment / Period</th><th class="r">Outstanding</th><th>Action</th></tr></thead><tbody>${monthlyPendingRows(pid).map(x=>`<tr><td><span class="pill">MONTHLY</span></td><td><b>${esc(x.def.name)}</b><div class="mu">${esc(paymentMonthLabel(x.period,'monthly'))}</div></td><td class="r out"><b>${inr(x.balance)}</b></td><td><button class="btn p ledgerReceiveSpecific" data-p="${pid}">Receive</button></td></tr>`).join('')}${CONTRIBS.filter(d=>d.e===cur&&d.type==='special'&&d.status==='Active').map(d=>{const b=Math.max(0,Number(d.amt||0)-contributionPaidByMember(d,pid));return b?`<tr><td><span class="pill w">SPECIAL</span></td><td><b>${esc(d.name)}</b><div class="mu">Special payment</div></td><td class="r out"><b>${inr(b)}</b></td><td><button class="btn p ledgerReceiveSpecific" data-p="${pid}">Receive</button></td></tr>`:''}).join('')||'<tr><td colspan="4" class="erp-empty">No outstanding payment items.</td></tr>'}</tbody></table></div></div>

function openMemberLedger(pid){
 if(!pid)return toast('Select a member first');
 $('#mb').innerHTML=memberLedgerHtml(pid);
 $('#modal').classList.add('show');
 $('#ledgerClose').onclick=()=>$('#modal').classList.remove('show');
 $('#ledgerReceivePayment').onclick=()=>openUnifiedReceive('',Number(pid));
 document.querySelectorAll('.ledgerReceiveSpecific').forEach(b=>b.onclick=()=>openUnifiedReceive('',Number(b.dataset.p)));
 document.querySelectorAll('.memberPaymentEdit').forEach(b=>b.onclick=()=>{
   const x=L.find(z=>z.id===Number(b.dataset.id));
   if(!x)return;
   const d=contribDef(x.contribId);
   ask('Edit Member Payment',[
     {k:'amount',l:'Amount received (₹)',t:'number',value:x.a,req:1},
     {k:'date',l:'Payment date',t:'date',value:x.d||''},
     {k:'period',l:'Month / period covered',value:x.period||'',req:x.pu==='monthly'?1:0},
     {k:'receipt',l:'Receipt / reference',value:x.receiptNo||x.ref||''},
     {k:'remarks',l:'Remarks',value:x.note||''},
     {k:'reason',l:'Reason for correction',t:'textarea',req:1}
   ],v=>{
     const amount=Number(v.amount||0);
     if(amount<=0)return toast('Amount must be greater than zero');
     const old={amount:x.a,date:x.d,period:x.period,receiptNo:x.receiptNo||x.ref||'',remarks:x.note||''};
     x.a=amount;
     x.d=v.date||x.d;
     x.period=v.period||'';
     x.receiptNo=v.receipt||'';
     x.ref=x.receiptNo;
     x.note=v.remarks||'';
     x.editHistory=x.editHistory||[];
     x.editHistory.push({
       at:new Date().toISOString(),
       old,
       new:{amount:x.a,date:x.d,period:x.period,receiptNo:x.receiptNo,remarks:x.note},
       reason:v.reason,
       correctedBy:'Admin'
     });
     toast('Payment corrected; correction history retained');
     openMemberLedger(Number(b.dataset.pid));
     draw();
   });
 });
 document.querySelectorAll('.memberPaymentReverse').forEach(b=>b.onclick=()=>{
   const x=L.find(z=>z.id===Number(b.dataset.id));
   if(!x||x.voided)return;
   ask('Reverse Member Payment',[{k:'reason',l:'Reason for reversal',t:'textarea',req:1}],v=>{
     x.voided=true;
     x.voidedAt=new Date().toISOString();
     x.voidReason=v.reason;
     x.editHistory=x.editHistory||[];
     x.editHistory.push({at:new Date().toISOString(),reason:'Payment reversal: '+v.reason,correctedBy:'Admin'});
     toast('Payment reversed; original entry retained');
     openMemberLedger(Number(b.dataset.pid));
     draw();
   });
 });

function savingsTx(pid){
 return (L||[]).filter(x=>x.e===cur&&x.pu==='savings'&&Number(x.p)===Number(pid)&&!x.voided)
   .sort((a,b)=>String(a.d||'').localeCompare(String(b.d||''))||Number(a.id||0)-Number(b.id||0));
}
function savingsTotals(pid){
 const tx=savingsTx(pid); let inn=0,out=0;
 tx.forEach(x=>{
  const a=Math.abs(Number(x.a||0));
  if(x.kind==='loan_disbursement'||x.kind==='loan_repayment') return;
  if(x.kind==='withdrawal'||Number(x.a||0)<0) out+=a; else inn+=a;
 });
 return {inn,out,balance:inn-out};
}
let savingsLoanSequence=0;
function newSavingsLoanId(){savingsLoanSequence++;return `LN-${String(cur).toUpperCase()}-${Date.now().toString(36).toUpperCase()}-${savingsLoanSequence}`;}
function memberLoanAccounts(pid){
 const tx=savingsTx(pid), disb=tx.filter(x=>x.kind==='loan_disbursement');
 const accounts=disb.map(x=>({loanId:x.loanId||('LEGACY-'+x.id),legacy:!x.loanId,memberId:Number(pid),date:x.d||'',principal:x.disbursementStatus==='pending'?0:Math.abs(Number(x.a||0)),approvedAmount:x.disbursementStatus==='pending'?Math.abs(Number(x.a||0)):0,disbursementStatus:x.disbursementStatus||'paid',ref:x.ref||'',note:x.note||'',disbursementId:x.id,repayments:[]}));
 const byId=new Map(accounts.map(x=>[String(x.loanId),x]));
 tx.filter(x=>x.kind==='loan_repayment').forEach(x=>{const a=Math.abs(Number(x.a||0));const target=x.loanId?byId.get(String(x.loanId)):null;if(target)target.repayments.push(x);else if(!x.loanId){/* Preserve old repayments without guessing which loan they belong to. */}});
 accounts.forEach(a=>{a.repaid=a.repayments.reduce((n,x)=>n+Math.abs(Number(x.a||0)),0);a.pending=Math.max(0,a.principal-a.repaid);a.status=a.disbursementStatus==='pending'?'Approved · Not Disbursed':a.pending<=0?'Repaid':'Active';});
 return accounts.sort((a,b)=>String(b.date).localeCompare(String(a.date))||Number(b.disbursementId)-Number(a.disbursementId));
}
function memberLoanStats(pid){
 const tx=savingsTx(pid);let given=0,repaid=0,unallocatedRepayments=0;
 tx.forEach(x=>{const a=Math.abs(Number(x.a||0));if(x.kind==='loan_disbursement'&&x.disbursementStatus!=='pending')given+=a;if(x.kind==='loan_repayment'){repaid+=a;if(!x.loanId)unallocatedRepayments+=a;}});
 return {given,repaid,pending:Math.max(0,given-repaid),unallocatedRepayments,accounts:memberLoanAccounts(pid)};
}
function savingsCashPosition(){
 const tx=(L||[]).filter(x=>x.e===cur&&x.pu==='savings'&&!x.voided);let received=0,paid=0;
 tx.forEach(x=>{const a=Math.abs(Number(x.a||0));if(x.kind==='deposit'||x.kind==='loan_repayment')received+=a;else if(x.kind==='withdrawal'||(x.kind==='loan_disbursement'&&x.disbursementStatus!=='pending')||Number(x.a||0)<0)paid+=a;});
 return {received,paid,balance:received-paid};
}
function allCommitteeLoans(){return (MEM[cur]||[]).flatMap(pid=>memberLoanAccounts(pid).map(x=>({...x,pid,name:pName(pid),code:pCode(pid)}))).sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(a.loanId).localeCompare(String(b.loanId)));}
function savingsLoanAccountPage(pid){
 const stats=memberLoanStats(pid),loans=stats.accounts;
 const rows=loans.map(l=>`<tr><td><b>${esc(l.loanId)}</b>${l.legacy?'<div class=mu>Legacy record · verify history</div>':''}</td><td>${esc(l.date||'—')}</td><td class=r>${inr(l.approvedAmount||l.principal)}</td><td class="r in">${inr(l.repaid)}</td><td class="r out"><b>${inr(l.pending)}</b></td><td><span class="pill ${l.status==='Repaid'?'':'bad'}">${l.status}</span></td><td>${l.legacy?'<span class=mu>Historical repayments not assigned</span>':`<button class="btn p savingsLoanRepayOne" data-p="${pid}" data-loan="${esc(l.loanId)}" ${l.pending<=0?'disabled':''}>Repay</button>`}</td></tr>`).join('');
 const hist=loans.flatMap(l=>[{...{},date:l.date,loanId:l.loanId,type:l.disbursementStatus==='pending'?'Approved · not disbursed':'Loan disbursed',amount:l.approvedAmount||l.principal,ref:l.ref,note:l.note,outstanding:l.principal,sort:l.date,sortId:l.disbursementId},...l.repayments.map(r=>({date:r.d,loanId:l.loanId,type:'Principal repayment',amount:Math.abs(Number(r.a||0)),ref:r.ref,note:r.note,outstanding:null,sort:r.d,sortId:r.id}))]).sort((a,b)=>String(b.sort).localeCompare(String(a.sort))||Number(b.sortId)-Number(a.sortId));
 const historyRows=hist.map(h=>`<tr><td>${esc(h.date||'—')}</td><td>${esc(h.loanId)}</td><td>${esc(h.type)}</td><td class="r ${h.type==='Principal repayment'?'in':'out'}">${inr(h.amount)}</td><td>${esc(h.ref||'—')}</td><td>${esc(h.note||'—')}</td></tr>`).join('');
 const legacyWarning=stats.unallocatedRepayments?`<div class="save-data-warning"><b>Historical data needs review:</b> ${inr(stats.unallocatedRepayments)} in older repayments has no Loan ID. These records are preserved and have not been assigned to a specific loan.</div>`:'';
 return `<div class="save-workspace"><div class="save-head"><div><div class="kicker">MEMBER FINANCIAL WORKSPACE</div><h2>Member Account</h2><span>${esc(ENT[cur].name)}</span></div><button class="btn" id="saveBackWorkspace">← Back to Accounts</button></div><div class="save-account-head"><div><div class="save-avatar">${esc((pName(pid)||'?').charAt(0).toUpperCase())}</div></div><div><div class="kicker">LOAN ACCOUNT</div><h2>${esc(pName(pid))}</h2><span>${esc(pCode(pid))} · ${esc(pMobile(pid)||'No mobile')}</span></div><div class="save-account-buttons action-grid"><button class="btn loan-action" id="savingsGiveLoan" data-p="${pid}">↗ Give Loan</button></div></div><div class="savings-bank-kpis"><div><span>Principal Given</span><b class="out">${inr(stats.given)}</b></div><div><span>Principal Repaid</span><b class="in">${inr(stats.repaid)}</b></div><div><span>Outstanding Principal</span><b>${inr(stats.pending)}</b></div><div><span>Loan Accounts</span><b>${loans.length}</b></div></div><div class="save-account-tabs"><button class="btn" id="savingsTabSavings" data-p="${pid}">Savings Account</button><button class="btn p" disabled>Loan Account</button></div>${legacyWarning}<div class="card"><div class="bar"><div><h3>Individual Loans</h3><span class="mu">Each loan is tracked independently. Repayments must be attached to a specific Loan ID.</span></div></div><div class="erp-table-wrap"><table class="erp-register-table"><thead><tr><th>Loan ID</th><th>Disbursement Date</th><th class="r">Principal</th><th class="r">Repaid</th><th class="r">Outstanding</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="note" style="padding:24px;text-align:center">No loans recorded for this member.</td></tr>'}</tbody></table></div></div><div class="card"><div class="bar"><div><h3>Loan Transaction History</h3><span class="mu">Disbursements and repayments, newest first.</span></div><button class="btn" id="savingsPrintLoanStatement" data-p="${pid}">Print Loan Statement</button></div><div class="erp-table-wrap"><table class="erp-register-table"><thead><tr><th>Date</th><th>Loan ID</th><th>Transaction</th><th class="r">Amount</th><th>Reference</th><th>Remarks</th></tr></thead><tbody>${historyRows||'<tr><td colspan="6" class="note" style="padding:24px;text-align:center">No loan transactions yet.</td></tr>'}</tbody></table></div></div></div>`;

function savingsMeetingDate(date){return savingsDateKey(new Date((date||new Date().toISOString().slice(0,10))+'T00:00:00'));}
function savingsDateKey(d){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
function savingsMeetingLabel(key){const m=SAVINGS_MEETINGS.find(x=>x.e===cur&&x.date===key);const d=new Date(key+'T00:00:00');return (m?.title||'Meeting')+' — '+d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}
function savingsMeetingPeriod(key){return new Date(key+'T00:00:00').toLocaleDateString('en-IN',{weekday:'long',day:'2-digit',month:'short',year:'numeric'});}
function savingsMeetingData(limit=30){
 const meetings=SAVINGS_MEETINGS.filter(m=>m.e===cur).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,limit);
 return meetings.map(m=>{
   const tx=(L||[]).filter(x=>x.e===cur&&x.pu==='savings'&&!x.voided&&Number(x.meetingId)===Number(m.id));
   let inn=0,out=0,loans=0; const members=new Set();
   tx.forEach(x=>{const a=Math.abs(Number(x.a||0)); const isOut=x.kind==='withdrawal'||x.kind==='loan_disbursement'||Number(x.a||0)<0; if(isOut)out+=a; else inn+=a; if(x.kind==='loan_disbursement'&&x.disbursementStatus!=='pending')loans+=a; if(x.p!=null)members.add(Number(x.p));});
   return {key:m.date,id:m.id,title:m.title||'Meeting',label:(m.title||'Meeting')+' — '+new Date(m.date+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}),period:savingsMeetingPeriod(m.date),inn,out,loans,net:inn-out,transactions:tx.length,members,rows:tx,createdBy:m.createdBy,createdAt:m.createdAt,note:m.note||'',status:m.status||'Open'};

function savingsRecord(pid,type,selectedLoanId=null){
 const t=savingsTotals(pid),accounts=memberLoanAccounts(pid);
 const kindMap={deposit:{title:'Savings Deposit',amountLabel:'Amount deposited (₹)',kind:'deposit'},withdrawal:{title:'Savings Withdrawal',amountLabel:'Amount withdrawn (₹)',kind:'withdrawal'},loan_disbursement:{title:'Give Loan to Member',amountLabel:'Loan principal (₹)',kind:'loan_disbursement'},loan_repayment:{title:'Record Loan Repayment',amountLabel:'Principal repayment (₹)',kind:'loan_repayment'}};
 const action=kindMap[type]||(type==='in'?kindMap.deposit:kindMap.withdrawal);
 const selectedLoan=selectedLoanId?accounts.find(x=>String(x.loanId)===String(selectedLoanId)):null;
 if(action.kind==='loan_repayment'&&!selectedLoan){
  const eligible=accounts.filter(x=>x.pending>0&&!x.legacy);
  if(!eligible.length)return toast('No identifiable active loan available. Review legacy loan records first.');
  if(eligible.length===1)return savingsRecord(pid,type,eligible[0].loanId);
  return ask('Select Loan for Repayment',[{k:'loanId',l:'Loan ID · Outstanding principal',t:'select',req:1,o:eligible.map(x=>[x.loanId,`${x.loanId} · ${inr(x.pending)} outstanding`])}],v=>savingsRecord(pid,type,v.loanId));
 }
 if(action.kind==='loan_repayment'&&(!selectedLoan||selectedLoan.pending<=0))return toast('Select a loan with outstanding principal.');
 const fields=[];
 if(action.kind==='loan_repayment')fields.push({k:'loanId',l:'Selected Loan ID',value:selectedLoan.loanId});
 fields.push({k:'amount',l:action.amountLabel,t:'number',req:1});
 fields.push({k:'date',l:'Transaction date',t:'date',value:new Date().toISOString().slice(0,10),req:1},{k:'ref',l:'Reference / receipt no.',value:''},{k:'note',l:'Description / remarks',t:'textarea',value:''});
 ask(action.title,fields,v=>{
  const amount=Number(v.amount||0),date=v.date||new Date().toISOString().slice(0,10);
  if(amount<=0)return toast('Enter a valid amount');
  if(!savingsCanRecord(date))return toast('Create the Meeting first before entering transactions.');
  if(action.kind==='withdrawal'&&amount>t.balance)return toast(`Insufficient savings balance. Available: ${inr(t.balance)}`);
  const freshLoan=action.kind==='loan_repayment'?memberLoanAccounts(pid).find(x=>String(x.loanId)===String(selectedLoan.loanId)):null;
  if(action.kind==='loan_repayment'&&(!freshLoan||amount>freshLoan.pending))return toast(`Repayment exceeds selected loan outstanding. Pending: ${inr(freshLoan?.pending||0)}`);
  const commit=()=>{
   const meeting=savingsMeetingForDate(date),rec={id:Date.now(),e:cur,p:pid,pu:'savings',kind:action.kind,a:amount,d:date,ref:v.ref||'',note:v.note||'',meetingId:meeting?.id||null};
   if(action.kind==='loan_disbursement')rec.loanId=newSavingsLoanId();
   if(action.kind==='loan_repayment')rec.loanId=freshLoan.loanId;
   L.push(rec);toast(action.kind==='loan_repayment'?'Loan repayment recorded':action.kind==='loan_disbursement'?'Loan disbursement recorded':action.kind==='deposit'?'Savings deposit recorded':'Savings withdrawal recorded');
   if(action.kind.startsWith('loan_'))window.savingsAccountTab='loan';draw();
  };
  if(action.kind==='loan_disbursement'){
   const cash=savingsCashPosition(),shortfall=amount-cash.balance;
   if(shortfall>0){
    if(appMode!=='superadmin')return toast(`Cash shortfall: ${inr(shortfall)}. Only an authorized admin may proceed.`);
    return ask('Cash Availability Warning',[{k:'summary',l:`Available cash: ${inr(cash.balance)} · Proposed loan: ${inr(amount)} · Shortfall: ${inr(shortfall)}`,value:'Review shortfall before proceeding'},{k:'authorized',l:'Authorization note (required)',req:1},{k:'status',l:'Disbursement status',t:'select',req:1,o:[['paid','Paid out now'],['pending','Approved but not yet paid']]}],w=>{
      if(!w.authorized.trim())return toast('Enter the authorization note');
      const meeting=savingsMeetingForDate(date),rec={id:Date.now(),e:cur,p:pid,pu:'savings',kind:'loan_disbursement',a:amount,d:date,ref:v.ref||'',note:[v.note,w.authorized.trim(),`Cash warning: ${inr(shortfall)} shortfall`,`Disbursement ${w.status==='paid'?'paid':'pending'}`].filter(Boolean).join(' · '),meetingId:meeting?.id||null,loanId:newSavingsLoanId(),disbursementStatus:w.status,authorizedBy:appMode};L.push(rec);toast('Loan recorded with cash-shortfall authorization');window.savingsAccountTab='loan';draw();
    });
   }
  }
  commit();
 });
}

function savingsOverviewRange(period,from,to){
 const today=new Date(); const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; let f='',t=key(today);
 if(period==='today'){f=t}
 else if(period==='month'){f=key(new Date(today.getFullYear(),today.getMonth(),1))}
 else if(period==='year'){f=key(new Date(today.getFullYear(),0,1))}
 else if(period==='custom'){f=from||'';t=to||''}

}
function savingsOverviewStats(period='all',from='',to=''){

 const tx=valid.filter(x=>(!range.from||x.d>=range.from)&&(!range.to||x.d<=range.to));
 let totalIn=0,totalOut=0;
 tx.forEach(x=>{const a=Math.abs(Number(x.a||0));if(x.kind==='loan_repayment'||(x.kind==='deposit'&&Number(x.a||0)>=0)){totalIn+=a;return;}if(x.kind==='withdrawal'||(x.kind==='loan_disbursement'&&x.disbursementStatus!=='pending')||Number(x.a||0)<0){totalOut+=a;}});

 const allLoanRepaid=valid.filter(x=>x.kind==='loan_repayment'&&(!range.from||x.d>=range.from)&&(!range.to||x.d<=range.to)).reduce((a,x)=>a+Math.abs(Number(x.a||0)),0);

 return {from:range.from,to:range.to,totalIn,totalOut,balance:allTimeIn-allTimeOut,periodNet:totalIn-totalOut,loanGiven:allLoanGiven,loanRepaid:allLoanRepaid,loanPending:currentLoanPending,txCount:tx.length};

 const renderMemberAndMonths=()=>{
   const raw=$('#nurkPayMember').value;
   const pid=findNurkMemberInNurk(n,raw);
   const amt=Number($('#nurkPayAmount').value||0);
   if(!pid){
     $('#nurkMemberMatch').innerHTML='<span class="out">Member not found in this NURK.</span>';
     $('#nurkAllocArea').innerHTML='<p class="note">Enter a valid member ID and amount.</p>';
     return;
   }
   $('#nurkMemberMatch').innerHTML=`<div class="card" style="margin-top:8px;padding:10px"><b>${pName(pid)}</b><div class="mu">NURK ID: ${getNurkMember(n,pid).nurkMemberId} · Committee ID: ${pCode(pid)} · ${pMobile(pid)||'No mobile'}</div></div>`;

   const rr=rows(n.e).filter(x=>x.ref===n.id);
   const pending=[];
   for(let i=1;i<=Number(n.months||NM);i++){
     const monthPaid=sum(rr.filter(x=>x.pu==='nurk_in'&&x.p===pid&&nurkCycleNumber(n,x)===i).map(x=>x.a));
     const due=n.amt;
     const isCovered=monthPaid>=due;
     if(!isCovered) pending.push({m:i,p:Math.max(0,due-monthPaid)});
   }
   const maxFullMonths=amt>0?Math.floor(amt/n.amt):0;
   const defaultMonths=pending.slice(0,maxFullMonths);
   if(!pending.length){
     $('#nurkAllocArea').innerHTML='<p class="note">No pending months for this member. The full amount will be recorded as advance/credit.</p>';
     return;
   }
   $('#nurkAllocArea').innerHTML=`<div class="checkgrid">${
     pending.map(x=>`<label class="checkitem">
       <input type="checkbox" class="nurkAllocMonth" data-month="${x.m}" ${defaultMonths.some(d=>d.m===x.m)?'checked':''}>
       <b>${esc(nurkMonthLabel(n,x.m))}</b>
       <div class="mu">Pending month · ₹${Number(x.p).toLocaleString('en-IN')} due</div>
     </label>`).join('')
   }</div>
   <p class="note" id="nurkAllocHint">Select months only — no amount is required per month.</p>`;
   updateAllocationHint();
 };
 const updateAllocationHint=()=>{
   const amt=Number($('#nurkPayAmount').value||0);
   const selected=[...document.querySelectorAll('.nurkAllocMonth:checked')];
   const totalCovered=selected.length*n.amt;
   const remainder=Math.max(0,amt-totalCovered);
   const over=totalCovered>amt;
   const hint=$('#nurkAllocHint');
   if(hint)hint.innerHTML=over
     ? `<span class="out">Selected months exceed the payment amount. Uncheck ${Math.ceil((totalCovered-amt)/n.amt)} month(s).</span>`
     : `${selected.length} month(s) covered · Payment received this month: <b>${inr(amt)}</b> · Advance/Credit: <b>${inr(remainder)}</b>`;
 };

async function ensureJsPDF(){
 if(window.jspdf?.jsPDF)return true;
 await new Promise((resolve,reject)=>{
   const sc=document.createElement('script');
   sc.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js';
   sc.onload=resolve; sc.onerror=reject; document.head.appendChild(sc);
 }).catch(()=>{});
 return !!window.jspdf?.jsPDF;
}
function paymentReportRowsForMember(pid){
 return (typeof L!=='undefined'?L:[]).filter(x=>x.e===cur && Number(x.p)===Number(pid) && !x.voided)
   .slice().sort((a,b)=>String(a.d||'').localeCompare(String(b.d||'')));
}
function paymentMonthlyReportData(month){
 const ym=String(month||'').slice(0,7);
 const records=(typeof L!=='undefined'?L:[]).filter(x=>x.e===cur && !x.voided && String(x.d||'').slice(0,7)===ym);
 const monthly=records.filter(x=>x.pu==='monthly'), special=records.filter(x=>x.pu==='special');
 return {ym,label:paymentMonthLabel(ym,'monthly'),records,monthly,special,
   monthlyCollected:monthly.reduce((a,x)=>a+Number(x.a||0),0),
   specialCollected:special.reduce((a,x)=>a+Number(x.a||0),0)};
}

 rows.push([],['Monthly Collected',d.monthlyCollected],['Special Collected',d.specialCollected],

function draw(){

 document.body.classList.toggle('save-focus',appMode!=='superadmin'&&view==='savings');
 const superAllowed=['superdashboard','mastermembers','organizations','admins','data','settings'];
 const nav=document.querySelector('#nav');
 const globalNav=document.querySelector('#globalNav');
 const orgGroup=nav ? nav.closest('.nav-group') : null;
 const globalGroup=globalNav ? globalNav.closest('.nav-group') : null;
 const back=document.querySelector('#backSuperAdmin');
 const modeLabel=document.querySelector('#portalModeLabel');
 const roleBadge=document.querySelector('#roleBadge');

 if(appMode==='superadmin'){
   $('#ctx').textContent='Super Admin Control';
   nav.innerHTML='';
   globalNav.innerHTML=superAllowed.map(m=>`<button class="${m===view?'on':''}" data-m="${m}">${MODS[m]}</button>`).join('');
   if(orgGroup)orgGroup.style.display='none';
   if(globalGroup)globalGroup.style.display='block';
   if(back)back.style.display='none';
   if(modeLabel)modeLabel.textContent='Super Admin Control Center';
   if(roleBadge)roleBadge.textContent='SUPER ADMIN';
 }else{
   $('#ctx').textContent='Entity: '+ENT[cur].name;
   nav.innerHTML=entityAllowed.map(m=>`<button class="${m===view?'on':''}" data-m="${m}">${MODS[m]}</button>`).join('');
   globalNav.innerHTML='';
   if(orgGroup)orgGroup.style.display='block';
   if(globalGroup)globalGroup.style.display='none';
   if(back)back.style.display='inline-flex';
   if(modeLabel)modeLabel.textContent=ENT[cur].name+' Portal';
   if(roleBadge)roleBadge.textContent=cur==='main'?'MAIN SOCIETY':'COMMITTEE';
 }

 document.querySelectorAll('#nav button,#globalNav button').forEach(b=>b.onclick=()=>{
   view=b.dataset.m;
   draw();
   scrollTo(0,0);
 });

 if(back)back.onclick=()=>{
   appMode='superadmin';
   cur='main';
   view='superdashboard';
   draw();
   scrollTo(0,0);
 };

 $('#ttl').textContent=MODS[view]||'Control Center';
 const pages=appMode==='superadmin'
   ? {superdashboard:superDashboard,mastermembers:masterMembers,organizations,admins,data:dataPage,settings}
   : {dashboard:dash,members,contributions,ledger,nurks,savings:savingsPage,loans:savingsPage,funds,expenses,notices,reports:paymentReportsPage,audit};
 const pageFn=pages[view]||soon;

 if(view==='contributions' && appMode!=='superadmin') document.body.classList.add('nurk-focus'); else if(view!=='nurks') document.body.classList.remove('nurk-focus');
 wire();
}

function paymentOverviewPage(){
 const defs=CONTRIBS.filter(d=>d.e===cur);
 const monthlyDefs=defs.filter(d=>d.type==='monthly' && d.status==='Active');
 const specialDefs=defs.filter(d=>d.type==='special' && d.status==='Active');
 const members=(MEM[cur]||[]);
 const monthlyDef=monthlyDefs[0];
 const monthlyAmt=Number(monthlyDef?.amt||ENT[cur]?.due?.amt||0);
 const now=new Date();
 const ym=now.toISOString().slice(0,7);
 const monthName=now.toLocaleString('en-IN',{month:'long',year:'numeric'});

 // Payment records for this entity. Keep calculations based on actual records.
 const records=(typeof L!=='undefined'?L:[]).filter(x=>x.e===cur);
 const currentMonthRecords=records.filter(x=>{
   const d=String(x.date||x.createdAt||'').slice(0,7);
   return d===ym;
 });
 const monthlyCollected=currentMonthRecords.filter(x=>x.type==='monthly').reduce((s,x)=>s+Number(x.a||x.amount||0),0);
 const specialCollected=currentMonthRecords.filter(x=>x.type==='special').reduce((s,x)=>s+Number(x.a||x.amount||0),0);

 // Current active monthly cycle: only members who are currently in this entity are considered.
 const monthlyExpected=members.length*monthlyAmt;
 const monthlyPending=Math.max(0,monthlyExpected-monthlyCollected);

 // Special expected is based on active definitions. A special definition is not forced
 // into a member's monthly obligation; it is displayed separately as a collection figure.
 const specialExpected=specialDefs.reduce((s,d)=>s+Number(d.amt||0)*members.length,0);
 const specialPending=Math.max(0,specialExpected-specialCollected);

 const totalExpected=monthlyExpected+specialExpected;
 const totalCollected=monthlyCollected+specialCollected;
 const totalPending=Math.max(0,totalExpected-totalCollected);
 const collectionRate=totalExpected?Math.min(100,(totalCollected/totalExpected)*100):0;

 const recent=records.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,8);
 const outstanding=members.map(pid=>{
   const paidAmt=records.filter(x=>Number(x.p)===Number(pid)).reduce((s,x)=>s+Number(x.a||x.amount||0),0);
   return {pid,paidAmt,pending:Math.max(0,monthlyAmt-paidAmt)};
 }).filter(x=>x.pending>0).sort((a,b)=>b.pending-a.pending).slice(0,8);

 return `
 <div class="payment-overview">
   <div class="bar">
     <div>
       <div class="kicker">Payment Overview</div>
       <h2 style="margin:3px 0 0">Monthly & Special Payments</h2>
       <div class="mu">Financial position for ${esc(monthName)} — calculated from recorded payment transactions.</div>
     </div>
     <div class="toolbar">
       <button class="btn p" id="overviewReceive">+ Receive Payment</button>
       <button class="btn" id="overviewGoManager">Payment Manager</button>
     </div>
   </div>

   <div class="pay-finance-grid">
     <div class="pay-finance-card primary">
       <div class="pay-finance-label">TOTAL EXPECTED</div>
       <div class="pay-finance-value">${inr(totalExpected)}</div>
       <div class="pay-finance-meta">Monthly + active special payments</div>
     </div>
     <div class="pay-finance-card collected">
       <div class="pay-finance-label">TOTAL COLLECTED</div>
       <div class="pay-finance-value">${inr(totalCollected)}</div>
       <div class="pay-finance-meta">${collectionRate.toFixed(1)}% collection rate</div>
     </div>
     <div class="pay-finance-card pending">
       <div class="pay-finance-label">TOTAL PENDING</div>
       <div class="pay-finance-value">${inr(totalPending)}</div>
       <div class="pay-finance-meta">Outstanding amount</div>
     </div>
     <div class="pay-finance-card special">
       <div class="pay-finance-label">SPECIAL COLLECTED</div>
       <div class="pay-finance-value">${inr(specialCollected)}</div>
       <div class="pay-finance-meta">${specialDefs.length} active special definition${specialDefs.length===1?'':'s'}</div>
     </div>
   </div>

   <div class="pay-section-grid">
     <div class="pay-breakdown-card">
       <div class="pay-section-title">Monthly Collection</div>
       <div class="pay-big-row"><span>Expected</span><strong>${inr(monthlyExpected)}</strong></div>
       <div class="pay-big-row"><span>Collected</span><strong class="positive">${inr(monthlyCollected)}</strong></div>
       <div class="pay-big-row"><span>Pending</span><strong class="negative">${inr(monthlyPending)}</strong></div>
       <div class="pay-progress"><span style="width:${monthlyExpected?Math.min(100,(monthlyCollected/monthlyExpected)*100):0}%"></span></div>
     </div>
     <div class="pay-breakdown-card">
       <div class="pay-section-title">Special Payments</div>
       <div class="pay-big-row"><span>Expected</span><strong>${inr(specialExpected)}</strong></div>
       <div class="pay-big-row"><span>Collected</span><strong class="positive">${inr(specialCollected)}</strong></div>
       <div class="pay-big-row"><span>Pending</span><strong class="negative">${inr(specialPending)}</strong></div>
       <div class="pay-progress"><span style="width:${specialExpected?Math.min(100,(specialCollected/specialExpected)*100):0}%"></span></div>
     </div>
   </div>

   <div class="pay-section-grid">
     <div class="erp-register-card">
       <div class="erp-register-head">
         <div><strong>Recent Receipts</strong><div class="mu">Latest recorded collections</div></div>
         <button class="btn" id="overviewHistory">Receipts / History</button>
       </div>
       <div class="erp-table-wrap">
         ${recent.length?`<table class="erp-register-table"><thead><tr><th>Date</th><th>Member</th><th>Type</th><th>Purpose / Period</th><th class="r">Amount</th></tr></thead><tbody>
         ${recent.map(x=>`<tr>
           <td>${esc(x.date||'—')}</td>
           <td>${esc(pName(x.p))}</td>
           <td>${x.type==='special'?'<span class="badge-blue">Special</span>':'<span class="pill">Monthly</span>'}</td>
           <td>${esc(x.month||x.name||x.purpose||x.n||'—')}</td>
           <td class="r in">${inr(Number(x.a||x.amount||0))}</td>
         </tr>`).join('')}</tbody></table>`:'<div class="erp-empty">No payment receipts recorded yet.</div>'}
       </div>
     </div>

     <div class="erp-register-card">
       <div class="erp-register-head">
         <div><strong>Members With Outstanding</strong><div class="mu">Monthly outstanding for the current cycle</div></div>
         <button class="btn" id="overviewSearchMembers">Payment Manager</button>
       </div>
       <div class="erp-table-wrap">
         ${outstanding.length?`<table class="erp-register-table"><thead><tr><th>Member ID</th><th>Member</th><th class="r">Pending</th><th>Action</th></tr></thead><tbody>
         ${outstanding.map(x=>`<tr>
           <td><span class="id-preview">${esc(pCode(x.pid))}</span></td>
           <td><span class="erp-member-name">${esc(pName(x.pid))}</span></td>
           <td class="r out">${inr(x.pending)}</td>
           <td><button class="btn overviewMemberReceive" data-p="${x.pid}">Receive</button></td>
         </tr>`).join('')}</tbody></table>`:'<div class="erp-empty">No outstanding monthly payments.</div>'}
       </div>
     </div>
   </div>
 </div>`;
}
